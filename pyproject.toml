[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "matrixscroll"
version = "0.6.3"
description = "Sign who authorized an AI agent's actions and verify it offline. Ed25519 envelopes for Git commits and MCP tool surfaces, with an optional ML-DSA/SLH-DSA overlay (FIPS 204/205)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "SSX360", email = "security@matrixscroll.com" },
]
keywords = [
    "ed25519",
    "ml-dsa",
    "slh-dsa",
    "post-quantum",
    "fips-204",
    "fips-205",
    "signing",
    "provenance",
    "root-of-trust",
    "secure-element",
    "ai",
    "supply-chain",
    "ssx360",
    "matrixscroll",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0",
]

[project.optional-dependencies]
pqc = [
    "liboqs-python>=0.12.0",
]
dev = [
    "pytest>=7.4",
    "build>=1.0",
    "hypothesis>=6.100",
    "pytest-cov>=4.1",
]
git = []
hardware = ["pyserial>=3.5"]
yubikey = ["python-pkcs11>=0.7"]  # experimental preview; mock path in tests
tpm = []  # experimental preview; software-sealed mock when MATRIXSCROLL_MODE=tpm
mcp = [
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
matrixscroll = "matrixscroll.cli:main"
matrixscroll-mcp = "matrixscroll.mcp:main"
ssx360 = "matrixscroll.ssx360_cli:main"
ssx360-ledger = "matrixscroll.ssx360_cli:ledger_main"

# Every link points at its final destination. The previous set routed
# Documentation and Verifier through ssx360.com redirects that land on
# matrixscroll.com, and "Reference Device" pointed at a page that no longer
# exists. Compare duplicated Documentation.
[project.urls]
Homepage = "https://matrixscroll.com"
Documentation = "https://matrixscroll.com/docs/"
Specification = "https://matrixscroll.com/spec/"
Verifier = "https://matrixscroll.com/verify/"
Repository = "https://github.com/SSX360/matrixscroll"
Source = "https://github.com/SSX360/matrixscroll"
Issues = "https://github.com/SSX360/matrixscroll/issues"
Whitepaper = "https://github.com/SSX360/matrixscroll/blob/main/docs/WHITEPAPER.md"
Changelog = "https://github.com/SSX360/matrixscroll/blob/main/CHANGELOG.md"
Discussions = "https://github.com/SSX360/matrixscroll/discussions"
Security = "https://github.com/SSX360/matrixscroll/blob/main/SECURITY.md"
"GitHub Action" = "https://github.com/SSX360/matrixscroll/tree/main/.github/actions/verify"
Tests = "https://github.com/SSX360/matrixscroll/tree/main/tests"
"Public Roadmap" = "https://github.com/SSX360/matrixscroll/blob/main/docs/ROADMAP_2026-07.md"
"Hardware Status" = "https://github.com/SSX360/matrixscroll/blob/main/docs/hardware-provider.md"
Maintainer = "https://ssx360.com/about"

[tool.hatch.build.targets.wheel]
packages = ["matrixscroll"]

[tool.hatch.build.targets.sdist]
include = [
    "/matrixscroll",
    "/controls",
    "/docs",
    "/schemas",
    "/examples",
    "/tests",
    "/vectors",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/SPEC.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
