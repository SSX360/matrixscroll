[package]
name = "matrixscroll-verify"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Matrix Scroll ledger and Ed25519 verifier (Rust start)"
readme = "README.md"
repository = "https://github.com/SSX360/matrixscroll"
keywords = ["matrixscroll", "ed25519", "ledger", "verify"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Kani is invoked via `cargo kani` when installed. Proofs are behind `#[cfg(kani)]`
# and do not need a normal Cargo dependency. See README.md.

[dev-dependencies]
# Reserved for future property tests. Kani itself is optional tooling, not a crate dep.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
