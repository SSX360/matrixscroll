name: ci-unit

permissions:
  contents: read

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: ubuntu · py3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,pqc]"

      - name: Validate Glama PyPI pin
        run: python scripts/validate_glama_pypi.py

      - name: Glama MCP stdio smoke (PyPI pin)
        run: |
          python -m pip install "matrixscroll[mcp]==$(python -c "import json; print(json.load(open('glama.json'))['packages'][0]['version'])")"
          python scripts/glama_stdio_smoke.py matrixscroll-mcp

      # Exit 2 means the metadata is consistent but the version is not on PyPI
      # yet, which is the normal state of a release PR. Only exit 1, inconsistent
      # metadata, should fail the build.
      - name: Release readiness
        run: |
          set +e
          python scripts/release-readiness.py
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::notice::Release staged but not yet published to PyPI."
            exit 0
          fi
          exit "$status"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Smoke-test CLI
        shell: bash
        run: |
          matrixscroll status
          tmp=$(mktemp -d)
          export MATRIXSCROLL_HOME="$tmp"
          echo '{"release":"smoke"}' > "$tmp/in.json"
          matrixscroll sign "$tmp/in.json" > "$tmp/out.json"
          matrixscroll verify "$tmp/out.json"

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify schemas from the installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python scripts/verify_installed_wheel_schemas.py

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*
