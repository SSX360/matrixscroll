name: codecov

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  coverage:
    name: coverage report (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]" pytest-cov

      - name: Run tests with coverage
        run: python -m pytest -q --cov=matrixscroll --cov-report=xml

      - name: Upload to Codecov (placeholder)
        uses: codecov/codecov-action@5a1cf8459139fc27cbb1a668abd67082787ad4c2 # v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
