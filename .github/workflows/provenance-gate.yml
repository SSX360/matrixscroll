name: provenance-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce:
        description: Run Scroll Gate in enforce mode (blocks on unsigned commits)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scroll-gate:
    name: Scroll Gate (hosted)
    runs-on: ubuntu-latest
    env:
      SSX360_API_KEY: ${{ secrets.SSX360_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Matrix Scroll (includes ssx360 CLI)
        run: pip install -e .

      - name: Resolve gate mode
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enforce }}" = "true" ]; then
            echo "mode=enforce" >> "$GITHUB_OUTPUT"
          else
            echo "mode=warn" >> "$GITHUB_OUTPUT"
          fi

      # Dependabot and fork pull requests never receive repository secrets, so a
      # hard requirement here fails an advisory gate for reasons the PR cannot fix.
      - name: Require SSX360 API key
        if: steps.gate.outputs.mode == 'enforce' && env.SSX360_API_KEY == ''
        run: |
          echo "Enforce mode reaches the hosted verifier, which needs the SSX360_API_KEY secret." >&2
          echo "Verification does not need a key. Run it offline instead:" >&2
          echo '  pip install "matrixscroll==0.6.2"' >&2
          echo "  matrixscroll envelope-verify-range --base <base> --head <head> --source notes" >&2
          echo "Protocol documentation: https://matrixscroll.com/docs/" >&2
          exit 1

      - name: Skip hosted verify (no API key)
        if: steps.gate.outputs.mode == 'warn' && env.SSX360_API_KEY == ''
        run: |
          {
            echo "## Scroll Gate"
            echo ""
            echo "**Skipped:** no \`SSX360_API_KEY\` available to this run."
            echo "Dependabot and fork pull requests cannot read repository secrets."
            echo "Offline provenance is still checked by \`verify-manifest\` and \`scroll-gate-smoke\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch envelope notes
        run: git fetch origin refs/notes/matrixscroll:refs/notes/matrixscroll || true

      - name: Hosted verify (warn mode)
        if: steps.gate.outputs.mode == 'warn' && env.SSX360_API_KEY != ''
        continue-on-error: true
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          ssx360 check \
            --hosted \
            --base "$RANGE_BASE" \
            --head "$RANGE_HEAD" \
            --source notes \
            --summary-output provenance-summary.json
          {
            echo "## Scroll Gate"
            echo ""
            echo "**Mode:** warn. Results are advisory and no merge is blocked."
            echo "**Range:** \`$RANGE_BASE..$RANGE_HEAD\`"
            echo "**Checked:** every commit in the range carries an Ed25519 commit envelope, read from \`refs/notes/matrixscroll\`."
            echo "**Verifier:** \`ssx360 check --hosted\`. The same check runs offline with \`matrixscroll envelope-verify-range --base $RANGE_BASE --head $RANGE_HEAD --source notes\`."
            echo "**Protocol:** [matrixscroll.com/docs](https://matrixscroll.com/docs/)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hosted verify (enforce mode)
        if: steps.gate.outputs.mode == 'enforce'
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          ssx360 check \
            --hosted \
            --base "$RANGE_BASE" \
            --head "$RANGE_HEAD" \
            --source notes \
            --summary-output provenance-summary.json

      - name: Upload provenance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-summary
          path: provenance-summary.json
          if-no-files-found: ignore
