version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # MCP 2.x removed mcp.server.fastmcp; keep receiving compatible 1.x updates.
      - dependency-name: "mcp"
        versions: [">=2"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        # Keep MCP's supported 1.x line independent from broad group updates.
        exclude-patterns: ["mcp"]
