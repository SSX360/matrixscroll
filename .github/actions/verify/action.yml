name: Matrix Scroll Verify
description: Verify a signed Matrix Scroll manifest or PR commit envelope range in CI.
branding:
  icon: shield
  color: green

inputs:
  manifest:
    description: Path to signed manifest JSON file (single-manifest mode)
    required: false
    default: ""
  head-ref:
    description: Head ref for commit-range verification (enables PR gate mode)
    required: false
    default: ""
  base-ref:
    description: Base ref for commit-range verification
    required: false
    default: ""
  source:
    description: Envelope source for range mode (local, notes, bundle)
    required: false
    default: "notes"
  bundle-dir:
    description: Bundle directory when source=bundle
    required: false
    default: ""
  notes-ref:
    description: Git notes ref for envelope transport
    required: false
    default: "refs/notes/matrixscroll"
  fetch-notes:
    description: Fetch notes ref from origin before range verification
    required: false
    default: "true"
  python-version:
    description: Python version for installing matrixscroll
    required: false
    default: "3.12"
  matrixscroll-version:
    description: matrixscroll package version pin (recommended 0.7.0)
    required: false
    default: "0.7.0"
  package-source:
    description: Workspace-local package path for repository self-tests; leave empty for PyPI
    required: false
    default: ""
  require-mode:
    description: Optional policy require-mode (v0.2.1+)
    required: false
    default: ""
  trusted-keys:
    description: Optional path to trusted public keys JSON (v0.2.1+)
    required: false
    default: ""
  summary-output:
    description: Optional path to write full range verification JSON summary
    required: false
    default: ""
  allow-empty-range:
    description: Explicitly accept a range holding no commits (range mode)
    required: false
    default: "false"
  verify-agent-scope:
    description: Verify linked agent_scope manifest signatures (range mode)
    required: false
    default: "false"

outputs:
  ok:
    description: Whether verification passed
    value: ${{ steps.verify.outputs.ok }}
  device_id:
    description: Signer device id from manifest (single-manifest mode)
    value: ${{ steps.verify.outputs.device_id }}
  mode:
    description: Provider mode from manifest signature block (single-manifest mode)
    value: ${{ steps.verify.outputs.mode }}
  verified_count:
    description: Number of verified commits (range mode)
    value: ${{ steps.verify.outputs.verified_count }}
  agent_count:
    description: Number of agent-authored verified commits (range mode)
    value: ${{ steps.verify.outputs.agent_count }}
  human_count:
    description: Number of human-authored verified commits (range mode)
    value: ${{ steps.verify.outputs.human_count }}
  modes:
    description: Comma-separated signature modes seen in range mode
    value: ${{ steps.verify.outputs.modes }}
  summary_path:
    description: Path to written summary JSON when summary-output is set
    value: ${{ steps.verify.outputs.summary_path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      id: setup
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install matrixscroll
      id: install
      shell: bash
      env:
        MS_VERSION: ${{ inputs.matrixscroll-version }}
        MS_PACKAGE_SOURCE: ${{ inputs.package-source }}
      run: |
        set -euo pipefail
        if [ -n "$MS_PACKAGE_SOURCE" ]; then
          package_source="$(python - "$MS_PACKAGE_SOURCE" <<'PY'
        import os
        from pathlib import Path
        import sys

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        source = Path(sys.argv[1]).resolve()
        try:
            source.relative_to(workspace)
        except ValueError:
            print(
                "::error title=Matrix Scroll verify::package-source must resolve inside GITHUB_WORKSPACE.",
                file=sys.stderr,
            )
            raise SystemExit(1)
        if not source.exists():
            print(
                "::error title=Matrix Scroll verify::package-source does not exist.",
                file=sys.stderr,
            )
            raise SystemExit(1)
        print(source)
        PY
          )"
          python -m pip install -- "$package_source"
        elif [ -n "$MS_VERSION" ]; then
          python -m pip install "matrixscroll==$MS_VERSION"
        else
          python -m pip install matrixscroll
        fi

    - name: Fetch envelope notes
      id: fetch
      if: inputs.head-ref != '' && inputs.fetch-notes == 'true' && inputs.source == 'notes'
      shell: bash
      env:
        MS_NOTES_REF: ${{ inputs.notes-ref }}
      run: |
        set -euo pipefail
        if [[ "$MS_NOTES_REF" == -* ]] || ! git check-ref-format "$MS_NOTES_REF"; then
          echo "::error title=Matrix Scroll verify::Invalid notes ref." >&2
          exit 1
        fi
        git fetch -- origin "$MS_NOTES_REF:$MS_NOTES_REF"

    # Runs even when an earlier step failed. A runner without Python, a refused
    # SDK install and an unfetchable notes ref all used to skip this step
    # entirely, which left every output blank. A blank `ok` is the one state a
    # calling gate can mistake for a pass, so this step always gets to write one.
    - name: Verify
      id: verify
      if: always()
      shell: bash
      env:
        MS_MANIFEST: ${{ inputs.manifest }}
        MS_HEAD_REF: ${{ inputs.head-ref }}
        MS_BASE_REF: ${{ inputs.base-ref }}
        MS_SOURCE: ${{ inputs.source }}
        MS_BUNDLE_DIR: ${{ inputs.bundle-dir }}
        MS_NOTES_REF: ${{ inputs.notes-ref }}
        MS_REQUIRE_MODE: ${{ inputs.require-mode }}
        MS_TRUSTED_KEYS: ${{ inputs.trusted-keys }}
        MS_SUMMARY_OUTPUT: ${{ inputs.summary-output }}
        MS_ALLOW_EMPTY_RANGE: ${{ inputs.allow-empty-range }}
        MS_VERIFY_AGENT_SCOPE: ${{ inputs.verify-agent-scope }}
        MS_FETCH_NOTES: ${{ inputs.fetch-notes }}
        MS_SETUP_OUTCOME: ${{ steps.setup.outcome }}
        MS_INSTALL_OUTCOME: ${{ steps.install.outcome }}
        MS_FETCH_OUTCOME: ${{ steps.fetch.outcome }}
      run: |
        # `shell: bash` runs as `bash --noprofile --norc -e -o pipefail`, so
        # errexit is already on when this script starts. Turning it off is the
        # point: aborting on the first non-zero status is what used to skip the
        # output writes and hand the caller a blank `ok`. Every failure path here
        # runs to the end, writes the outputs, then exits with a chosen status.
        set +e
        set -u -o pipefail

        emit_fallback_outputs() {
          # Last line of defence. If the parser never ran, or died before it
          # could write, the eight outputs still get fail-closed values.
          if ! grep -q '^ok=' "$GITHUB_OUTPUT" 2>/dev/null; then
            {
              echo "ok=False"
              echo "device_id="
              echo "mode="
              echo "verified_count=0"
              echo "agent_count=0"
              echo "human_count=0"
              echo "modes="
              echo "summary_path="
            } >> "$GITHUB_OUTPUT"
          fi
        }

        PARSER="$GITHUB_ACTION_PATH/parse_verify_output.py"
        if command -v python3 >/dev/null 2>&1; then
          PY=python3
        elif command -v python >/dev/null 2>&1; then
          PY=python
        else
          echo "::error title=Matrix Scroll verify::No Python interpreter on PATH, so the manifest cannot be verified." >&2
          emit_fallback_outputs
          exit 1
        fi

        OUTPUT_FILE="$(mktemp)"

        fail_to_start() {
          export MS_CONFIG_ERROR="$1"
          MS_OUTPUT_FILE="$OUTPUT_FILE" MS_CLI_RC=1 "$PY" "$PARSER"
          RC=$?
          emit_fallback_outputs
          exit "$RC"
        }

        if [ -n "$MS_HEAD_REF" ]; then
          export MS_MODE=range
        else
          export MS_MODE=manifest
        fi

        if [ "$MS_SETUP_OUTCOME" != "success" ]; then
          fail_to_start "Python setup failed; verification did not run."
        fi
        if [ "$MS_INSTALL_OUTCOME" != "success" ]; then
          fail_to_start "The matrixscroll SDK install failed; verification did not run."
        fi
        if [ -n "$MS_HEAD_REF" ] && [ "$MS_SOURCE" = "notes" ]; then
          if [[ "$MS_NOTES_REF" == -* ]] || ! git check-ref-format "$MS_NOTES_REF"; then
            fail_to_start "Invalid notes ref. Expected a full Git ref such as refs/notes/matrixscroll."
          fi
          if [ "$MS_FETCH_NOTES" = "true" ] && [ "$MS_FETCH_OUTCOME" != "success" ]; then
            fail_to_start "Fetching envelope notes failed; verification did not run."
          fi
        fi
        export MS_SUMMARY_PREEXISTED=false
        if [ -n "$MS_SUMMARY_OUTPUT" ] && [ -e "$MS_SUMMARY_OUTPUT" ]; then
          export MS_SUMMARY_PREEXISTED=true
          fail_to_start "summary-output already exists; choose a fresh path for this verification run."
        fi

        if [ -n "$MS_HEAD_REF" ]; then
          ARGS=(envelope-verify-range --head "$MS_HEAD_REF")
          if [ -n "$MS_BASE_REF" ]; then
            ARGS+=(--base "$MS_BASE_REF")
          fi
          ARGS+=(--source "$MS_SOURCE")
          ARGS+=(--notes-ref "$MS_NOTES_REF")
          if [ -n "$MS_BUNDLE_DIR" ]; then
            ARGS+=(--bundle "$MS_BUNDLE_DIR")
          fi
          if [ -n "$MS_SUMMARY_OUTPUT" ]; then
            ARGS+=(--summary-output "$MS_SUMMARY_OUTPUT")
          fi
          if [ "$MS_ALLOW_EMPTY_RANGE" = "true" ]; then
            ARGS+=(--allow-empty-range)
          fi
          if [ -n "$MS_REQUIRE_MODE" ]; then
            ARGS+=(--require-mode "$MS_REQUIRE_MODE")
          fi
          if [ -n "$MS_TRUSTED_KEYS" ]; then
            ARGS+=(--trusted-keys "$MS_TRUSTED_KEYS")
          fi
          if [ "$MS_VERIFY_AGENT_SCOPE" = "true" ]; then
            ARGS+=(--verify-agent-scope)
          fi
        elif [ -n "$MS_MANIFEST" ]; then
          ARGS=(verify "$MS_MANIFEST")
          if [ -n "$MS_REQUIRE_MODE" ]; then
            ARGS+=(--require-mode "$MS_REQUIRE_MODE")
          fi
          if [ -n "$MS_TRUSTED_KEYS" ]; then
            ARGS+=(--trusted-keys "$MS_TRUSTED_KEYS")
          fi
        else
          fail_to_start "Either manifest or head-ref must be provided."
        fi

        matrixscroll "${ARGS[@]}" >"$OUTPUT_FILE" 2>&1
        CLI_RC=$?
        cat "$OUTPUT_FILE"

        MS_OUTPUT_FILE="$OUTPUT_FILE" MS_CLI_RC="$CLI_RC" "$PY" "$PARSER"
        RC=$?
        emit_fallback_outputs
        exit "$RC"
