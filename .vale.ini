StylesPath = .vale/styles
MinAlertLevel = warning

Packages = Google, \
  write-good, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.28.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.28.0/ai-tells-commits.zip

Vocab = SSX360

# Vale has no TSX/JSX parser. Site copy in .tsx is handled by the LLM pass
# described in docs/explanation/writing-workflow.md, not by Vale.
[formats]
COMMIT_EDITMSG = md

[*.{md,rst,txt,html}]
BasedOnStyles = Vale, Google, write-good, ai-tells, SSX360

# Google.Headings enforces sentence case but trips on our proper nouns; the
# SSX360 vocabulary handles those. Passive voice is covered by write-good.
Google.Passive = NO
write-good.E-Prime = NO
Vale.Spelling = NO

# Third-party and generated prose is not ours to rewrite.
[docs/superpowers/**]
BasedOnStyles = Vale

# Legacy flat docs predate this gate and are migrating into the Diataxis tree
# incrementally. The list is the same one `exclude_docs` in mkdocs.yml carries,
# and an entry leaves this list the moment its file moves under docs/tutorial,
# docs/how-to, docs/reference, or docs/explanation. Everything already migrated,
# plus README, SPEC, SECURITY, and CONTRIBUTING, is held to the full rule set.
[docs/{ADOPTER_KIT,AGENTIC_AI_SECURITY,AIMS_INTEROP,CI_HARD_GATE,COMMIT_TIME_VS_ARTIFACT_TIME,COMPARISON,CRYPTO_BACKEND,CRYPTO_ROADMAP,DOCTRINE,FIVE_MINUTES,GITTUF_INTEROP,GIT_AI_NOTES_INTEROP,HERO_DEMO,OPENSSF_SANDBOX_DECISION,POC2_AUDIT,ROADMAP_2026-07,SE050_POC_SCOPE,SE050_USB_PROTOCOL,SECURITY_PROPERTIES,SLSA_SOURCE_TRACK_MAPPING,SOFTWARE_PRODUCTS,WHITEPAPER,delegation-attestation-rfc,hardware-provider,quickstart-agent,quickstart-claude-code,quickstart-git,quickstart-mcp,registries-guide,rekor-guac-bridge-design,yubikey-bridge,yubikey-smoke}.md]
BasedOnStyles = Vale

[CHANGELOG.md]
BasedOnStyles = Vale

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits, SSX360
ai-tells.SycophancyMarkers = NO
ai-tells.ClosingPleasantries = NO

# The style-guide files necessarily quote the phrases they ban, so the
# claim-safety rules would flag their own prohibition lists. Vocabulary and
# structure rules still apply to them.
[{AGENTS.md,CLAUDE.md,**/style-supplement.md,**/writing-workflow.md}]
SSX360.Certification = NO
# These files must be able to show the banned dash characters.
SSX360.Dashes = NO
ai-tells.EmDashUsage = NO
Google.EmDash = NO
SSX360.Slop = NO
SSX360.ComplianceHedge = NO
SSX360.Register = NO
SSX360.NegativeParallelism = NO
ai-tells.OverusedVocabulary = NO
ai-tells.AICompoundPhrases = NO
